[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nobox"
version = "0.1.0"
description = "GitHub-as-email inbox for AI ↔ human async messaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Simone 'evilsocket' Margaritelli" },
    { name = "Alessandro Coccia" },
]
keywords = ["github", "email", "imap", "mcp", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0",
    "click>=8.1",
    "platformdirs>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
imap = ["twisted[tls]>=24"]
pgp = ["pgpy>=0.6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]
all = ["nobox[imap,pgp]"]

[project.scripts]
nobox = "nobox.cli:main"

[project.urls]
Homepage = "https://github.com/evilsocket/nobox"

[tool.hatch.build.targets.wheel]
packages = ["src/nobox"]
include = [
    "src/nobox/_logo.ansi",
    "src/nobox/_logo.txt",
    "src/nobox/skill/SKILL.md",
]

[tool.hatch.build.targets.wheel.shared-data]
"src/nobox/skill" = "share/nobox/skill"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
